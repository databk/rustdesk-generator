name: Build RustDesk for Windows x86 (sciter)

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      build-id:
        description: 'Build UUID used by the console to track this build'
        required: false
        type: string
        default: ''
      backend-url:
        description: 'Console backend URL (base path for callback and config endpoints)'
        required: false
        type: string
        default: ''
      upload-token:
        description: 'Callback token authenticating the POST to the console'
        required: false
        type: string
        default: ''

  workflow_dispatch:
    inputs:
      build-id:
        description: 'Build UUID used by the console to track this build'
        required: true
        type: string
      backend-url:
        description: 'Console backend URL (base path for callback and config endpoints)'
        required: true
        type: string
      upload-token:
        description: 'Callback token authenticating the POST to the console'
        required: true
        type: string

env:
  SCITER_RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503, also 1.78 has ABI change which causes our sciter version not working, https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  RUST_VERSION: "1.75" # sciter failed on m1 with 1.78 because of https://blog.rust-lang.org/2024/03/30/i128-layout-update.html
  MAC_RUST_VERSION: "1.81" # 1.81 is requred for macos, because of https://github.com/yury/cidre requires 1.81
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  # Windows arm64 only: the first stable Flutter to ship a native arm64 Windows Dart SDK +
  # engine is 3.44. Every other platform stays on FLUTTER_VERSION (3.24.5) until Windows 7
  # support is restored after the upstream-wide Flutter bump. The arm64 job patches the few
  # 3.44-only source/pubspec changes on the fly (see "Patch RustDesk sources for Flutter 3.44").
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  # for arm64 linux because official Dart SDK does not work
  FLUTTER_ELINUX_VERSION: "3.16.9"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29
  # If we change the `VCPKG COMMIT_ID`, please remember:
  # 1. Call `$VCPKG_ROOT/vcpkg x-update-baseline` to update the baseline in `vcpkg.json`.
  #  Or we may face build issue like 
  #  https://github.com/rustdesk/rustdesk/actions/runs/14414119794/job/40427970174
  # 2. Update the `VCPKG_COMMIT_ID` in `ci.yml` and `playground.yml`.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836" # 2025.01.13, got "/opt/artifacts/vcpkg/vcpkg: No such file or directory" with latest version
  VERSION: "1.5.1"
  NDK_VERSION: "r28c"
  #signing keys env variable checks
  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}-2"

jobs:
  build-for-windows-sciter:
    name: ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    # Temporarily disable this action due to additional test is needed.
    # if: false
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
          - {
              target: i686-pc-windows-msvc,
              os: windows-2022,
              arch: x86,
              vcpkg-triplet: x86-windows-static,
            }
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Try restore base build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backend-url != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="base-windows-${{ matrix.job.arch }}"
          if gh release download "$TAG" -R "${{ github.repository }}" -D ./base-build --clobber 2>/dev/null; then
            tar xzf ./base-build/rustdesk-base-windows-${{ matrix.job.arch }}.tar.gz
            echo "SKIP_BUILD=true" >> $GITHUB_ENV
            echo "Restored base build from Release"
          else
            echo "SKIP_BUILD=false" >> $GITHUB_ENV
            echo "No base build found, will compile from source"
          fi

      - name: Checkout generator scripts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backend-url != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: generator-scripts
          sparse-checkout: .github/scripts

      - name: Fetch custom client config
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backend-url != '' }}
        shell: bash
        run: |
          bash generator-scripts/.github/scripts/fetch-custom-config.sh \
            "${{ inputs.backend-url }}" \
            "${{ inputs.upload-token }}" \
            ./custom-config
          if [ "${{ env.SKIP_BUILD }}" != "true" ] && [ -f ./custom-config/public-key.txt ]; then
            PUBKEY=$(cat ./custom-config/public-key.txt)
            sed -i "s|5Qbwsde3unUcJBtrx9ZkvUmwFNoExHzpryHuPUdqlWM=|${PUBKEY}|g" src/common.rs
            echo "Replaced public key in src/common.rs"
          fi

      - name: Install LLVM and Clang
        if: env.SKIP_BUILD != 'true'
        uses: rustdesk-org/install-llvm-action-32bit@6aa7d9ad3df84dff01cd4596dd0fc880a7f47fce # no release tag; commit 2026-05-26
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        shell: bash
        run: |
          # Sciter's abi_thiscall feature requires nightly Rust.
          # Use an i686 host toolchain so build scripts can load the 32-bit LLVM installed above.
          # Since rustup 1.29.1, i686 toolchains on x64 Windows require --force-non-host
          # for both installation and default selection, even though WOW64 can run them.
          # See https://github.com/rust-lang/rustup/pull/4935.
          # Alternatively, an x64 compiler could use cargo build --target i686-pc-windows-msvc.
          # This requires 64-bit LLVM for host build scripts and updated packaging paths,
          # and has not been manually verified for RustDesk.
          rustup toolchain install nightly-2023-10-13-${{ matrix.job.target }} \
            --target ${{ matrix.job.target }} --component rustfmt \
            --profile minimal --no-self-update --force-non-host
          rustup default nightly-2023-10-13-${{ matrix.job.target }} --force-non-host

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ${{ matrix.job.os }}-sciter

      - name: Setup vcpkg with Github Actions binary cache
        if: env.SKIP_BUILD != 'true'
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        if: env.SKIP_BUILD != 'true'
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      - name: Build rustdesk
        if: env.SKIP_BUILD != 'true'
        id: build
        shell: bash
        run: |
          python3 res/inline-sciter.py
          # Patch sciter x86
          sed -i 's/branch = "dyn"/branch = "dyn_x86"/g' ./Cargo.toml
          cargo update -p sciter-rs --precise 674e07d3066ca9a92ced3816203ab6b652629d1e
          cargo build --locked --features inline,vram,hwcodec --release --bins
          mkdir -p ./Release
          mv ./target/release/rustdesk.exe ./Release/rustdesk.exe
          curl -LJ -o ./Release/sciter.dll https://github.com/c-smile/sciter-sdk/raw/master/bin.win/x32/sciter.dll
          echo "output_folder=./Release" >> $GITHUB_OUTPUT
          curl -LJ -o ./usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip usbmmidd_v2.zip
          # Do not remove x64 files, because the user may run the 32bit version on a 64bit system.
          # Do not remove ./usbmmidd_v2/deviceinstaller64.exe, as x86 exe cannot install and uninstall drivers when running on x64,
          # we need the x64 exe to install and uninstall the driver.
          rm -rf ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release || true

      - name: find Runner.res
        if: env.SKIP_BUILD != 'true'
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res");
          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found";
          else
            echo "Runner.res: $runner_res";
            cp $runner_res ./libs/portable/Runner.res;
            echo "list ./libs/portable/Runner.res";
            ls -l ./libs/portable/Runner.res;
          fi

      - name: Upload base build to Release
        if: ${{ github.event_name == 'workflow_dispatch' && env.SKIP_BUILD != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="base-windows-${{ matrix.job.arch }}"
          tar czf rustdesk-base-windows-${{ matrix.job.arch }}.tar.gz Release
          gh release create "$TAG" -R "${{ github.repository }}" --title "Base build for Windows ${{ matrix.job.arch }}" --notes "Auto-generated base build" || true
          gh release upload "$TAG" -R "${{ github.repository }}" rustdesk-base-windows-${{ matrix.job.arch }}.tar.gz --clobber

      - name: Inject custom client files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backend-url != '' }}
        shell: bash
        run: |
          if [ -f ./custom-config/custom.txt ]; then
            cp ./custom-config/custom.txt ./Release/custom.txt
            echo "Injected custom.txt"
          fi
          ASSETS_DIR="./Release/data/flutter_assets/assets"
          mkdir -p "${ASSETS_DIR}"
          for LOGO in ./custom-config/logos/*; do
            [ -f "${LOGO}" ] || continue
            cp "${LOGO}" "${ASSETS_DIR}/$(basename "${LOGO}")"
            echo "Injected logo: $(basename "${LOGO}")"
          done

      - name: Upload unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-windows-${{ matrix.job.arch }}
          path: Release

      - name: Sign rustdesk files
        if: env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          pip3 install requests argparse
          BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./Release/

      - name: Verify template payload signatures
        if: env.SIGN_BASE_URL != '-2'
        shell: powershell
        run: |
          Get-ChildItem ./Release -Recurse -File -ErrorAction Stop |
            Where-Object { $_.Extension -eq '.exe' -or ($_.Extension -eq '.dll' -and $_.FullName -notmatch 'RustDeskPrinterDriver|usbmmidd_v2') } |
            ForEach-Object {
              $signature = Get-AuthenticodeSignature -LiteralPath $_.FullName -ErrorAction Stop
              if ($signature.Status -ne 'Valid') { throw "Invalid template payload signature: $($_.FullName) ($($signature.Status))" }
            }

      - name: Build template packer
        if: env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -e rustdesk.exe -l 11 -t "${{ matrix.job.target }}"
          popd
          mkdir -p ./packer-template
          cp ./target/${{ matrix.job.target }}/release/rustdesk-portable-packer.exe ./packer-template/rustdesk-template-${{ matrix.job.arch }}.exe

      - name: Upload unsigned template packer
        if: env.SIGN_BASE_URL != '-2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-packer-template-${{ matrix.job.arch }}
          path: ./packer-template
          if-no-files-found: error

      - name: Build self-extracted executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -e ../../Release/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}-sciter.exe

      - name: Sign rustdesk self-extracted file
        if: env.SIGN_BASE_URL != '-2'
        shell: bash
        run: |
          BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }} python3 res/job.py sign_files ./SignOutput/


      - name: Checkout generator scripts
        if: github.event_name == 'workflow_dispatch' && inputs.backend-url != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: generator-scripts
          sparse-checkout: .github/scripts
          clean: false

      - name: Upload artifacts to console
        if: github.event_name == 'workflow_dispatch' && inputs.backend-url != ''
        shell: bash
        run: |
          bash generator-scripts/.github/scripts/upload-artifacts.sh \
            "${{ inputs.backend-url }}" \
            "${{ inputs.upload-token }}" \
            ./SignOutput
