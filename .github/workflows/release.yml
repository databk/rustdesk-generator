name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
      skipped: ${{ steps.changelog.outputs.skipped }}
      source_commit: ${{ steps.changelog.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: TriPSs/conventional-changelog-action@v6
        id: changelog
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          output: CHANGELOG.md
          skip-on-empty: true

      - name: Verify stable version
        if: steps.changelog.outputs.skipped != 'true'
        run: |
          VERSION="${{ steps.changelog.outputs.version }}"
          if ! echo "$VERSION" | grep -qE '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Version $VERSION is not a stable release (contains pre-release suffix)"
            exit 1
          fi

      - name: Verify source commit matches HEAD
        if: steps.changelog.outputs.skipped != 'true'
        run: |
          SOURCE_COMMIT="${{ steps.changelog.outputs.source_commit }}"
          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$SOURCE_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "Source commit $SOURCE_COMMIT does not match HEAD $HEAD_COMMIT"
            exit 1
          fi

  build:
    name: Build
    needs: prepare
    if: needs.prepare.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/out/
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/out/

      - name: Create release archive
        run: |
          tar -czf rustdesk-generator-${{ needs.prepare.outputs.version }}.tar.gz frontend/out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: CHANGELOG.md
          files: rustdesk-generator-${{ needs.prepare.outputs.version }}.tar.gz

  docker:
    name: Docker Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/out/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine version tags
        id: tags
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          echo "tags=ghcr.io/databk/rustdesk-generator:${VERSION},ghcr.io/databk/rustdesk-generator:${MAJOR}.${MINOR},ghcr.io/databk/rustdesk-generator:${MAJOR},ghcr.io/databk/rustdesk-generator:latest,databk/rustdesk-generator:${VERSION},databk/rustdesk-generator:${MAJOR}.${MINOR},databk/rustdesk-generator:${MAJOR},databk/rustdesk-generator:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SOURCE_COMMIT=${{ needs.prepare.outputs.source_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=RustDesk Generator
            org.opencontainers.image.description=RustDesk Custom Client Builder
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_commit }}