name: Custom Client Build

on:
  workflow_dispatch:
    inputs:
      build-id:
        description: 'Build UUID used by the console to track this build'
        required: true
        type: string
      callback-url:
        description: 'Console callback URL to POST build status and artifacts to'
        required: true
        type: string
      callback-token:
        description: 'Callback token authenticating the POST to the console'
        required: true
        type: string
      os:
        description: 'Target OS (windows, linux, macos, android, ios)'
        required: true
        type: string
      arch:
        description: 'Target architecture (x86_64, aarch64, x86, armv7)'
        required: true
        type: string
      custom-json:
        description: 'Custom client configuration JSON (reserved for future use)'
        required: false
        type: string
        default: ''

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target
        shell: bash
        run: |
          OS="${{ inputs.os }}"
          ARCH="${{ inputs.arch }}"
          if [ "$OS" != "windows" ] || [ "$ARCH" != "x86_64" ]; then
            echo "::error::Only windows/x86_64 is supported in the first iteration"
            exit 1
          fi

  build:
    needs: guard
    uses: ./.github/workflows/windows-x86_64.yml
    with:
      upload-artifact: true

  callback:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 30
    steps:
      - name: Download build artifacts
        if: needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Flatten artifacts
        if: needs.build.result == 'success'
        id: flatten
        shell: bash
        run: |
          mkdir -p ./upload
          find ./artifacts -type f -exec cp -f {} ./upload/ \;
          echo "count=$(find ./upload -type f | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Notify build success
        if: needs.build.result == 'success'
        shell: bash
        run: |
          FILES_ARGS=()
          for f in ./upload/*; do
            [ -f "$f" ] && FILES_ARGS+=(-F "files=@$f")
          done
          if [ "${#FILES_ARGS[@]}" -eq 0 ]; then
            echo "::error::No artifact files found to upload"
            exit 1
          fi
          curl -fsS -X POST "${{ inputs.callback-url }}" \
            -H "X-Callback-Token: ${{ inputs.callback-token }}" \
            -F "status=completed" \
            "${FILES_ARGS[@]}"

      - name: Notify build failure
        if: needs.build.result != 'success'
        shell: bash
        run: |
          curl -fsS -X POST "${{ inputs.callback-url }}" \
            -H "X-Callback-Token: ${{ inputs.callback-token }}" \
            -F "status=failed" \
            -F "message=Build job result: ${{ needs.build.result }}" || true
