name: Notify Console

on:
  workflow_call:
    inputs:
      callback-url:
        description: 'Console callback URL to POST build status and artifacts to'
        required: true
        type: string
      callback-token:
        description: 'Callback token authenticating the POST to the console'
        required: true
        type: string
      build-success:
        description: 'Whether all build jobs succeeded'
        required: true
        type: boolean

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download build artifacts
        if: ${{ inputs.build-success }}
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Strip non-product artifacts
        if: ${{ inputs.build-success }}
        shell: bash
        run: |
          rm -rf ./artifacts/bridge-artifact \
                 ./artifacts/bridge-artifact-flutter-3.44 \
                 ./artifacts/topmostwindow-artifacts-x64 \
                 ./artifacts/topmostwindow-artifacts-ARM64

      - name: Notify console
        shell: bash
        run: |
          if [ "${{ inputs.build-success }}" != "true" ]; then
            curl -fsS -X POST "${{ inputs.callback-url }}" \
              -H "X-Callback-Token: ${{ inputs.callback-token }}" \
              -F "status=failed" \
              -F "message=One or more build jobs failed" || true
            exit 0
          fi
          mkdir -p ./upload
          find ./artifacts -type f -exec cp -f {} ./upload/ \; 2>/dev/null || true
          FILES_ARGS=()
          for f in ./upload/*; do
            [ -f "$f" ] && FILES_ARGS+=(-F "files=@$f")
          done
          if [ "${#FILES_ARGS[@]}" -eq 0 ]; then
            curl -fsS -X POST "${{ inputs.callback-url }}" \
              -H "X-Callback-Token: ${{ inputs.callback-token }}" \
              -F "status=failed" \
              -F "message=No artifact files found" || true
            exit 0
          fi
          curl -fsS -X POST "${{ inputs.callback-url }}" \
            -H "X-Callback-Token: ${{ inputs.callback-token }}" \
            -F "status=completed" \
            "${FILES_ARGS[@]}"
